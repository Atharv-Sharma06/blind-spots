[project]
name = "blindspots"
version = "0.1.0"
description = "Blind Spots analysis service: microgravity combustion evidence mapping, calibrated uncertainty and computational research candidates."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "pyarrow",
    "openpyxl",
    "httpx",
    "python-docx",
    "typer",
]

[project.scripts]
blindspots = "blindspots.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blindspots"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/blindspots/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = false
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "openpyxl.*", "docx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["blindspots.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# macOS + iCloud Desktop can mark the editable-install .pth as hidden, which Python 3.12 skips.
pythonpath = ["src"]
